plugins {
    id 'fabric-loom' version '1.15.5'
    id 'maven-publish'
}

// Version bumping is opt-in via -PbumpVersion to ensure clean reproducible open-source builds
if (project.hasProperty('bumpVersion')) {
    def propsFile = file('gradle.properties')
    if (propsFile.exists()) {
        def text = propsFile.getText('UTF-8')
        def matcher = (text =~ /mod_version\s*=\s*([0-9]+)\.([0-9]+)\.([0-9]+)/)
        if (matcher.find()) {
            def major = matcher.group(1)
            def minor = matcher.group(2)
            def patch = (matcher.group(3) as int) + 1
            def newVersion = "${major}.${minor}.${patch}"
            def updatedText = matcher.replaceFirst("mod_version=${newVersion}")
            propsFile.setText(updatedText, 'UTF-8')
            project.extensions.extraProperties.set('mod_version', newVersion)
            println "=========================================================="
            println " [LinkenVisuals] Bumped patch version to: ${newVersion}"
            println "=========================================================="
        }
    }
}

// -Pstrange builds the StrangeVisuals-family jar (Classic/Beta GUI, Vanilla/Beta
// menu, legacy HUD). Without the flag the jar is Linken-only. The two style
// families are mutually exclusive at runtime; see StyleFlavor.
def strangeFlavor = project.hasProperty('strange')
    && !project.property('strange').toString().equalsIgnoreCase('false')
def flavorName = strangeFlavor ? 'strange' : 'linken'

// Optimization jars dropped here are embedded as Fabric Jar-in-Jar entries.
// Release jars only; see optimization-mods/README.md.
def optimizationModsDir = file('optimization-mods')
def optimizationJarFiles = fileTree(optimizationModsDir) { include '*.jar' }

version = project.mod_version
group = project.maven_group

base {
    archivesName = strangeFlavor
        ? "${project.archives_base_name}-strange"
        : project.archives_base_name
}

// Generate the compile-time flavor constant; never edit build/ by hand.
def flavorOutDir = layout.buildDirectory.dir('generated/sources/buildFlavor/java')
def generateBuildFlavor = tasks.register('generateBuildFlavor') {
    inputs.property('flavorName', flavorName)
    outputs.dir(flavorOutDir)
    doLast {
        def file = flavorOutDir.get().file('dev/linkenvisuals/BuildFlavor.java').asFile
        file.parentFile.mkdirs()
        file.text = """package dev.linkenvisuals;

/** Generated by build.gradle; true only for the -Pstrange flavor. */
public final class BuildFlavor {
    public static final String NAME = "${flavorName}";
    public static final boolean STRANGE = ${strangeFlavor};

    private BuildFlavor() {
    }
}
"""
    }
}
sourceSets.main.java.srcDir(flavorOutDir)
tasks.named('compileJava') {
    dependsOn generateBuildFlavor
}
println "=========================================================="
println " [LinkenVisuals] Build flavor: ${flavorName} (jar: ${base.archivesName.get()}-${project.version}.jar)"
println "=========================================================="

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

def prepareOptimizationJars = tasks.register('prepareOptimizationJars', Copy) {
    from(optimizationModsDir) {
        include '*.jar'
    }
    into(layout.buildDirectory.dir('generated/optimization-jars/META-INF/jars'))
}

processResources {
    dependsOn prepareOptimizationJars
    inputs.property 'version', project.version
    inputs.files(optimizationJarFiles)
    // META-INF/jars/* is copied from optimization-mods/ by the task above.
    from(layout.buildDirectory.dir('generated/optimization-jars'))
    filesMatching('fabric.mod.json') {
        expand 'version': inputs.properties.version
    }
    // Keep the source fabric.mod.json valid JSON for Loom's configuration
    // parser; inject the actual nested-jar list into the processed copy.
    doLast {
        def manifest = layout.buildDirectory.file('resources/main/fabric.mod.json').get().asFile
        if (!manifest.exists()) {
            return
        }
        def jars = optimizationJarFiles.files.sort { it.name }.collect { jar ->
            "    {\"file\": \"META-INF/jars/${jar.name}\"}"
        }.join(",\n")
        def text = manifest.getText('UTF-8')
        if (!jars.isEmpty()) {
            text = text.replace('"jars": []', "\"jars\": [\n${jars}\n  ]")
        }
        manifest.setText(text, 'UTF-8')
    }
}

// Guard the contract: every optimization-mods/*.jar must be inside the final
// jar and declared in fabric.mod.json, otherwise Fabric Loader ignores it.
def verifyEmbeddedOptimizationJars = tasks.register('verifyEmbeddedOptimizationJars') {
    dependsOn remapJar
    doLast {
        def built = remapJar.archiveFile.get().asFile
        def expected = optimizationJarFiles.files.sort { it.name }
        def ids = new HashSet<String>()
        ids.add('linkenvisuals')
        new java.util.zip.ZipFile(built).withCloseable { zip ->
            def metaEntry = zip.getEntry('fabric.mod.json')
            if (metaEntry == null) {
                throw new GradleException("fabric.mod.json missing from ${built.name}")
            }
            def meta = zip.getInputStream(metaEntry).getText('UTF-8')
            expected.each { jar ->
                def path = "META-INF/jars/${jar.name}"
                if (zip.getEntry(path) == null) {
                    throw new GradleException("missing ${path} in ${built.name}")
                }
                if (!meta.contains(path)) {
                    throw new GradleException("fabric.mod.json does not declare ${path}")
                }
                new java.util.zip.ZipFile(jar).withCloseable { nested ->
                    def nestedMeta = nested.getEntry('fabric.mod.json')
                    if (nestedMeta == null) {
                        throw new GradleException("${jar.name} has no fabric.mod.json")
                    }
                    def data = new groovy.json.JsonSlurper().parse(nested.getInputStream(nestedMeta))
                    def id = data.id?.toString()
                    if (id == null || id.isBlank()) {
                        throw new GradleException("${jar.name} has no Fabric mod id")
                    }
                    if (!ids.add(id)) {
                        throw new GradleException("duplicate embedded mod id '${id}' (${jar.name})")
                    }
                    println " [LinkenVisuals] embedded ${id} ${data.version ?: '?'} (${jar.name})"
                }
            }
        }
        println " [LinkenVisuals] verified ${expected.size()} embedded optimization jar(s)"
    }
}
check.dependsOn verifyEmbeddedOptimizationJars

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// In-game smoke test run. The driver waits for a world, then exercises every
// module/setting, spawns no-AI mobs and attacks them. Start it manually in any
// other client run with /lvtest start. Add -Dlinkenvisuals.autotest.quit=true
// to close the client when the report is ready. -PautotestWorld=<save> jumps
// straight into an existing world (vanilla --quickPlaySingleplayer).
def autotestWorld = project.findProperty('autotestWorld')
def autotestQuit = project.hasProperty('autotestQuit')
def autotestWidth = project.findProperty('autotestWidth')
def autotestHeight = project.findProperty('autotestHeight')
loom {
    runs {
        autotest {
            client()
            configName = "AutoTest Client"
            vmArg "-Dlinkenvisuals.autotest=true"
            if (autotestQuit) {
                vmArg "-Dlinkenvisuals.autotest.quit=true"
            }
            if (autotestWorld != null) {
                programArg "--quickPlaySingleplayer"
                programArg autotestWorld.toString()
            }
            if (autotestWidth != null) {
                programArg "--width"
                programArg autotestWidth.toString()
            }
            if (autotestHeight != null) {
                programArg "--height"
                programArg autotestHeight.toString()
            }
        }
        liveTest {
            client()
            configName = "Live Server Test"
            vmArg "-Dlinkenvisuals.livetest=true"
            programArg "--quickPlayMultiplayer"
            programArg "localhost:25566"
        }
    }
}

// Optional local deploy: copies the remapped jar into a Minecraft mods folder
// when -PmultiMcModsDir=<path> is passed (set it in ~/.gradle/gradle.properties,
// never hardcode machine-specific paths in the repository).
remapJar.doLast {
    if (!project.hasProperty('multiMcModsDir')) {
        return
    }
    def modsDir = file(project.property('multiMcModsDir'))
    if (!modsDir.exists()) {
        println "=========================================================="
        println " [LinkenVisuals] multiMcModsDir does not exist: ${modsDir.absolutePath} — skipping deploy"
        println "=========================================================="
        return
    }
    // Remove stale builds of this mod first: two jars with the same mod id
    // make Fabric refuse to launch ("Duplicate mod").
    def currentJarName = remapJar.archiveFile.get().asFile.name
    modsDir.listFiles().findAll {
        it.isFile() && it.name.startsWith("${project.archives_base_name}-") && it.name.endsWith('.jar') && it.name != currentJarName
    }.each { it.delete() }

    copy {
        from remapJar.archiveFile
        into modsDir
    }
    println "=========================================================="
    println " [LinkenVisuals] Copied ${remapJar.archiveFile.get().asFile.name} to ${modsDir.absolutePath}!"
    println "=========================================================="
}
